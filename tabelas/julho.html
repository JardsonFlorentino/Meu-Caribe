<!DOCTYPE html>
<html lang="pt-br" data-ano="2026" data-mes-index="6" data-mes-key="julho" data-titulo="Tábua de Marés - Julho 2026"
    data-local="Maragogi-AL">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tábua de Marés - Julho 2026</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./calendario.css" />
</head>

<body>
    <main class="mare-cal-wrap">
        <div class="mare-cal-header">
            <div>
                <h2 id="mareCalTitle" class="mare-cal-title" data-i18n="tide.calendar.title">Tábua de Marés</h2>
                <p id="mareCalSubtitle" class="mare-cal-subtitle">Maragogi-AL</p>
            </div>
            <div class="mare-cal-hint" aria-label="Legenda rápida">
                <span class="mare-cal-pill mare-cal-pill--verde"><span class="mare-cal-pillArrow"
                        aria-hidden="true">↓</span><span data-i18n="tide.calendar.pill.very_low">muito
                        baixa</span></span>
                <span class="mare-cal-pill mare-cal-pill--amarelo"><span class="mare-cal-pillArrow"
                        aria-hidden="true">→</span><span data-i18n="tide.calendar.pill.medium">média</span></span>
                <span class="mare-cal-pill mare-cal-pill--vermelho"><span class="mare-cal-pillArrow"
                        aria-hidden="true">↑</span><span data-i18n="tide.calendar.pill.high">alta</span></span>
            </div>
        </div>

        <p id="mareCalStatus" class="mare-cal-status" role="status" aria-live="polite"
            data-i18n="tide.calendar.loading">Carregando dados…</p>

        <div class="mare-cal-tableWrap" role="region" aria-label="Tábua de marés (formato compacto)" tabindex="0">
            <table class="mare-cal-table" aria-label="Calendário de marés">
                <thead>
                    <tr>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.monday">Segunda-feira</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.tuesday">Terça-feira</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.wednesday">Quarta-feira</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.thursday">Quinta-feira</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.friday">Sexta-feira</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.saturday">Sábado</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                        <th scope="col">
                            <div class="mare-cal-th">
                                <div class="mare-cal-thDay" data-i18n="weekdays.sunday">Domingo</div>
                                <div class="mare-cal-thSub" aria-hidden="true"><span
                                        data-i18n="tide.calendar.hour">Hora</span><span
                                        data-i18n="tide.calendar.height">Altura</span>
                                </div>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="mareCalBody"></tbody>
            </table>
        </div>

    </main>

    <script src="../i18n.js" defer></script>
    <script src="./calendario.js" defer></script>
    <script src="./embed-height.js" defer></script>
</body>

</html>
